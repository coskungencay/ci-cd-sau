name: CI/CD + DevSecOps Demo Pipeline

# Pipeline tetikleyicileri:
# - main branch'e yapilan push'larda calisir
# - main branch'e acilan pull request'lerde calisir
# - Actions sekmesinden manuel olarak da calistirilabilir
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Unit testler + Semgrep ile statik guvenlik analizi (SAST)
  # Pipeline'in ilk kalite kapisi. Testler veya SAST basarisiz olursa
  # sonraki job'lar (build, deploy) hic calismaz. Bu "fail fast" prensibidir.
  # ---------------------------------------------------------------------------
  test-and-sast:
    name: Test & SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with pytest
        run: pytest tests/

      # Semgrep, kodda bilinen guvenlik zaafiyet pattern'lerini arar (SAST).
      # Demo sirasinda yanlis pozitiflerin pipeline'i kirmamasi icin
      # default ruleset kullaniliyor.
      - name: Run Semgrep SAST scan
        uses: semgrep/semgrep-action@v1

  # ---------------------------------------------------------------------------
  # JOB 2: Docker image build + Trivy ile container guvenlik taramasi
  # Sadece test-and-sast yesil olursa calisir.
  # Trivy, image icindeki OS paketlerinde ve Python bagimliliklarinda
  # bilinen CVE'leri arar. HIGH veya CRITICAL bulunursa pipeline kirilir.
  # Bu bizim "DevSecOps security gate"imizdir.
  # ---------------------------------------------------------------------------
  docker-build-and-trivy:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test-and-sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t demo-api:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: demo-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1
          # Henuz upstream'de fix yayinlanmamis CVE'leri yoksay.
          # Boylece "yapacak bir sey olmayan" zaafiyetler pipeline'i kirmaz;
          # ama fix'i bulunan ciddi bir acik geldiginde gate yine devreye girer.
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # JOB 3: GitHub Pages'e gercek deploy
  # Sadece test/SAST + Trivy guvenlik gate'i basarili olursa calisir.
  # web/ klasorundeki statik sayfayi GitHub Pages'e yayinlar; boylece
  # "kalite ve guvenlik kapilarindan gecen build canli URL'de gorunur olur".
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docker-build-and-trivy

    permissions:
      pages: write       # Pages'e deploy edebilmek icin
      id-token: write    # OIDC token (deploy-pages action'i icin gerekli)
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Announce deployment
        run: |
          echo "All CI/CD and DevSecOps checks passed."
          echo "Deploying static site to GitHub Pages..."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
